<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery | Distinguished Artist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-white: #f8f8f8;
            --color-dark-gray: #1f2223;
            --color-coral: #13543E;
            --color-beige-gold: #dc143c;
            --color-light-accent: #2A7F62;
            --color-dark-accent: #0C3B2E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, var(--color-white  ) 0%, #ede7d9 100%);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 380px;
            height: 100%;
            background-color: var(--color-white);
            border-right: 1px solid rgba(19, 84, 62, 0.2);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-header .logo {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-coral), var(--color-light-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            letter-spacing: 2px;
        }

        .sidebar-header .tagline {
            font-size: 1rem;
            color: var(--color-dark-gray);
            margin-top: 10px;
            line-height: 1.5;
        }

        .artwork-info {
            transition: opacity 0.4s ease;
        }

        .artwork-info .info-title {
            font-size: 2.5rem;
            font-weight: 500;
            color: var(--color-dark-accent);
            margin-bottom: 10px;
            line-height: 1.2;
            font-style: italic;
        }

        .artwork-info .info-category {
            font-size: 1rem;
            color: var(--color-coral);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .artwork-info .info-description {
            font-size: 1rem;
            color: #555;
            line-height: 1.7;
        }

        .sidebar-footer .nav-link a {
            color: var(--color-dark-gray);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.4s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 30px;
            border: 2px solid var(--color-coral);
            border-radius: 50px;
        }

        .sidebar-footer .nav-link a:hover {
            color: white;
            background-color: var(--color-coral);
        }

        /* --- Main Content (Gallery) --- */
        .main-content {
            flex-grow: 1;
            height: 100vh;
            overflow-y: auto;
            padding: 40px;
        }

        .gallery-wall {
            display: grid;
            /* Changed to display 3 columns and adjusted gap */
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            justify-items: center;
        }

        /* --- Baroque Frame Style --- */
        .painting-frame {
            position: relative;
            width: 100%; /* Make frame responsive */
            max-width: 350px; /* Set a max-width */
            aspect-ratio: 350 / 450; /* Maintain aspect ratio */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .frame-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .artwork-container {
            position: absolute;
            top: 15%;
            left: 18%;
            width: 63%;
            height: 72%;
            background: var(--color-white);
            overflow: hidden;
            z-index: 2;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .artwork-image {
            width: 100%;
            height: 75%;
            object-fit: cover;
            cursor: zoom-in; /* Add zoom-in cursor */
        }

        .gallery-label {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--color-white);
            font-size: 0.7rem;
            padding: 5px;
            flex-grow: 1;
        }

        .artwork-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--color-dark-gray);
            margin-bottom: 2px;
            font-family: 'Georgia', serif;
            font-style: italic;
        }

        .artwork-details {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .artwork-medium {
            font-size: 0.95rem;
            color: var(--color-coral);
            font-family: 'Georgia', serif;
            text-align: center;
        }

        /* --- Modal for Enlarged Image --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            margin: auto;
            display: block;
            max-width: 80%;
            max-height: 80%;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 1400px) {
            .gallery-wall {
                grid-template-columns: repeat(2, 1fr); /* 2 columns for medium screens */
            }
        }

        @media (max-width: 992px) {
            body {
                flex-direction: column;
                height: auto;
                overflow: auto;
            }
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid rgba(19, 84, 62, 0.2);
                text-align: center;
            }
            .artwork-info {
                display: none;
            }
            .main-content {
                height: auto;
                padding: 30px 20px;
            }
             .gallery-wall {
                grid-template-columns: 1fr; /* 1 column for small screens */
            }
        }

        @media (max-width: 768px) {
            .main-content {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            .painting-frame {
                width: 100%;
                max-width: 350px;
                margin: 0 auto;
            }
        }
    </style>
</head>

            const galleryWall = document.getElementById('gallery-wall' );

            const artworkDetailsPanel = document.getElementById('artwork-details-panel');

            // Modal elements
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("modalImage");
            const closeModal = document.querySelector(".close-modal");

            function renderPaintings() {
                if (!galleryWall) return;
                galleryWall.innerHTML = '';

                paintingsData.forEach(painting => {
                    const paintingHTML = `
                        <div class="painting-frame" 
                             data-title="${painting.title}" 
                             data-medium="${painting.medium}" 
                             data-description="${painting.description}">
                            <img src="https://res.cloudinary.com/dj4k75lkt/image/upload/v1760308797/7e5a4e78d2fd42b7805709d144cab1c8_qvriep.png" alt="Frame" class="frame-image">
                            <div class="artwork-container">
                                <img src="${painting.imageUrl}" alt="${painting.title}" class="artwork-image">
                                <div class="gallery-label">
                                    <h4 class="artwork-title">"${painting.title}"</h4>
                                    <div class="artwork-details">
                                        <span class="artwork-medium">${painting.medium}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    galleryWall.insertAdjacentHTML('beforeend', paintingHTML );
                });
            }

            function addGalleryInteractions() {
                document.querySelectorAll('.painting-frame').forEach(frame => {
                    // Update details on hover
                    frame.addEventListener('mouseenter', () => {
                        const title = frame.getAttribute('data-title');
                        const medium = frame.getAttribute('data-medium');
                        const description = frame.getAttribute('data-description');

                        artworkDetailsPanel.style.opacity = 0;
                        setTimeout(() => {
                            infoTitleEl.textContent = title;
                            infoCategoryEl.textContent = medium;
                            infoDescriptionEl.textContent = description;
                            artworkDetailsPanel.style.opacity = 1;
                        }, 300);
                    });

                    // Open modal on image click
                    const artworkImage = frame.querySelector('.artwork-image');
                    artworkImage.addEventListener('click', (e) => {
                        e.stopPropagation(); // Prevent hover event from firing
                        modal.style.display = "flex";
                        modalImg.src = artworkImage.src;
                    });
                });

                // Close modal events
                closeModal.onclick = () => {
                    modal.style.display = "none";
                }

                window.onclick = (event) => {
                    if (event.target == modal) {
                        modal.style.display = "none";
                    }
                }
            }

            renderPaintings();
            addGalleryInteractions();
        });
